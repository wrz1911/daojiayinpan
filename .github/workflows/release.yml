name: Release

on:
  push:
    tags: ['v*']

jobs:
  # 静态检查: eslint.config.js 把 no-undef / no-redeclare 设为 error 级,
  # 用于拦截 strict IIFE 下的未声明赋值(历史上踩过 4 次, 均被 catch 吞掉表现为功能无反应)
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: ESLint
        run: npx eslint qimen_app/js/*.js

      # bundle 是入库的产物, 忘了重建就会: CI 一切正常, 但直接打开 yinpan.html
      # 跑的是旧代码。这里重建一次并比对, 不一致即失败。
      - name: 校验 bundle 与源码同步
        run: |
          npm run build:bundle
          git diff --exit-code qimen_app/js/qimen_bundle.min.js \
            || { echo "::error::qimen_bundle.min.js 与源码不同步, 请在本地运行 npm run build:bundle 并提交"; exit 1; }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set version from tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VER"
          perl -i -pe "s/\"version\": \"[^\"]*\"/\"version\": \"$VER\"/" src-tauri/tauri.conf.json

      - name: Setup frontend
        shell: bash
        run: |
          mkdir -p web/qimen_app/css web/qimen_app/js
          cat > web/index.html << 'EOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
          <meta http-equiv="refresh" content="0;url=qimen_app/yinpan.html">
          <script>window.location.replace('qimen_app/yinpan.html');</script></head><body></body></html>
          EOF
          npm install --legacy-peer-deps >/dev/null 2>&1
          npm run build:bundle
          # CSS 用压缩产物, 但沿用 HTML 里的引用名(见 scripts/build_bundle.sh)
          cp qimen_app/css/yinpan_app.min.css web/qimen_app/css/yinpan_app.css
          cp qimen_app/js/qimen_bundle.min.js web/qimen_app/js/
          cp qimen_app/js/gong_detail_data.js web/qimen_app/js/
          cp qimen_app/yinpan.html web/qimen_app/

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Tauri build
        run: npx tauri build --no-bundle

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: app-exe
          path: |
            src-tauri/target/release/app.exe
            src-tauri/target/release/WebView2Loader.dll

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      
      - name: Set version from tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VER"
          perl -i -pe "s/\"version\": \"[^\"]*\"/\"version\": \"$VER\"/" src-tauri/tauri.conf.json

      - name: Setup frontend
        run: |
          mkdir -p web/qimen_app/css web/qimen_app/js
          npm install --legacy-peer-deps >/dev/null 2>&1
          npm run build:bundle
          # CSS 用压缩产物, 但沿用 HTML 里的引用名(见 scripts/build_bundle.sh)
          cp qimen_app/css/yinpan_app.min.css web/qimen_app/css/yinpan_app.css
          cp qimen_app/js/qimen_bundle.min.js web/qimen_app/js/
          cp qimen_app/js/gong_detail_data.js web/qimen_app/js/
          cp qimen_app/yinpan.html web/qimen_app/
          cat > web/index.html << 'HTMLEOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
          <meta http-equiv="refresh" content="0;url=qimen_app/yinpan.html">
          <script>window.location.replace('qimen_app/yinpan.html');</script></head><body></body></html>
          HTMLEOF

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tauri build
        run: npx tauri build --bundles dmg

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      
      - name: Set version from tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VER"
          perl -i -pe "s/\"version\": \"[^\"]*\"/\"version\": \"$VER\"/" src-tauri/tauri.conf.json

      - name: Setup frontend
        run: |
          mkdir -p web/qimen_app/css web/qimen_app/js
          npm install --legacy-peer-deps >/dev/null 2>&1
          npm run build:bundle
          # CSS 用压缩产物, 但沿用 HTML 里的引用名(见 scripts/build_bundle.sh)
          cp qimen_app/css/yinpan_app.min.css web/qimen_app/css/yinpan_app.css
          cp qimen_app/js/qimen_bundle.min.js web/qimen_app/js/
          cp qimen_app/js/gong_detail_data.js web/qimen_app/js/
          cp qimen_app/yinpan.html web/qimen_app/
          cat > web/index.html << 'HTMLEOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
          <meta http-equiv="refresh" content="0;url=qimen_app/yinpan.html">
          <script>window.location.replace('qimen_app/yinpan.html');</script></head><body></body></html>
          HTMLEOF

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # AppImage 由 linuxdeploy 打包, 它依赖 patchelf(改 RPATH)与
      # squashfs-tools(mksquashfs 生成镜像)、zsync(zsyncmake 生成增量文件)。
      # runner 镜像不保证预装, 缺任一项会以 "failed to run linuxdeploy" 告终。
      - name: Install AppImage bundling deps
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf squashfs-tools zsync

      - name: Tauri build (deb/rpm)
        run: npx tauri build --bundles deb,rpm

      # AppImage 单独构建且允许失败:它是新增产物,打包链路依赖 linuxdeploy
      # 外部工具(见上一步)。若该环节出问题,不应连带阻断 deb/rpm 的发布
      # —— upload-artifact 对缺失路径只告警不报错。
      - name: Tauri build (AppImage)
        continue-on-error: true
        run: |
          # 1) 生成 AppDir 并出包(CI 环境自洽, 这步通常成功)
          npx tauri build --bundles appimage
          # 2) 打「WebKit 辅助进程路径」补丁后重新打包。不做这步的话, 产物在
          #    未安装 webkit2gtk-4.1 的机器上会以
          #    "Unable to spawn a new child process" 启动失败 —— 而那些系统
          #    恰恰是 AppImage 唯一可用的形态。原理见 scripts/build-appimage.sh。
          bash scripts/build.sh appimage --patch-only

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-pkg
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set version from tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "VER=$VER" >> $GITHUB_ENV
          echo "Setting version to $VER"
          perl -i -pe "s/\"version\": \"[^\"]*\"/\"version\": \"$VER\"/" src-tauri/tauri.conf.json
          perl -i -pe "s/\"version\": \"[^\"]*\"/\"version\": \"$VER\"/" package.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Setup www dir
        run: |
          mkdir -p www/qimen_app/css www/qimen_app/js
          cat > www/index.html << 'EOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
          <meta http-equiv="refresh" content="0;url=qimen_app/yinpan.html">
          <script>window.location.replace('qimen_app/yinpan.html');</script></head><body></body></html>
          EOF
          cp qimen_app/css/yinpan_app.css www/qimen_app/css/
          npm install --no-save --legacy-peer-deps esbuild >/dev/null 2>&1
          npm run build:bundle
          cp qimen_app/js/qimen_bundle.min.js www/qimen_app/js/
          cp qimen_app/js/gong_detail_data.js www/qimen_app/js/
          cp qimen_app/yinpan.html www/qimen_app/

      - name: Init Capacitor
        run: |
          rm -rf android
          npx cap add android
          # 覆盖variables.gradle: 保留Capacitor默认的AndroidX版本号, 仅修改minSdk
          sed -i 's/minSdkVersion = 23/minSdkVersion = 31/' android/variables.gradle
          # 2026-09-28 全面升级(用户授权不兼容旧版安卓):
          # compileSdk/targetSdk 37 + AGP 9.4.1 + Gradle 9.8 + JDK 27。
          # (原 targetSdk 压 34 是规避 Android 15 edge-to-edge; 升 37 后状态栏
          #  走 edge-to-edge 行为, 装机后须实测, 必要时在 styles 补适配)
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 37/' android/variables.gradle
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 37/' android/variables.gradle
          # AGP 9.4.1(模板默认 8.13, 需 Gradle 9.8 配套)
          sed -E -i 's|gradle:[0-9.]+"|gradle:9.4.1"|' android/build.gradle
          sed -E -i 's|gradle-[0-9.]+-all\.zip|gradle-9.8.0-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          # Gradle 9 移除了 Project.buildDir
          sed -i 's|delete rootProject.buildDir|delete rootProject.layout.buildDirectory|' android/build.gradle
          # MainActivity: 字体缩放固定 + edge-to-edge insets 适配(targetSdk 37)
          # (主题项 statusBarColor 等在 Android 15+ 被忽略, 适配全走代码)
          cat > android/app/src/main/java/com/qimen/yinpan/MainActivity.java << 'MAEOF'
          package com.qimen.yinpan;

          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  // registerPlugin 必须在 super.onCreate 之前(Bridge 在 super 内 create)
                  registerPlugin(NativeSharePlugin.class);
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().getSettings().setTextZoom(100);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  getWindow().setStatusBarColor(Color.TRANSPARENT);
                  getWindow().setNavigationBarColor(Color.TRANSPARENT);
                  View root = findViewById(android.R.id.content);
                  ViewCompat.setOnApplyWindowInsetsListener(root, (v, insets) -> {
                      Insets sys = insets.getInsets(WindowInsetsCompat.Type.systemBars());
                      v.setPadding(sys.left, sys.top, sys.right, sys.bottom);
                      return WindowInsetsCompat.CONSUMED;
                  });
                  applySystemBarAppearance();
              }

              private void applySystemBarAppearance() {
                  View root = findViewById(android.R.id.content);
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), root);
                  boolean lightUi = (getResources().getConfiguration().uiMode
                          & Configuration.UI_MODE_NIGHT_MASK) != Configuration.UI_MODE_NIGHT_YES;
                  c.setAppearanceLightStatusBars(lightUi);
                  c.setAppearanceLightNavigationBars(lightUi);
              }
          }
          MAEOF
          # NativeSharePlugin: 原生分享桥(替代静默失效的 navigator.share)
          cat > android/app/src/main/java/com/qimen/yinpan/NativeSharePlugin.java << 'NSPEOF'
          package com.qimen.yinpan;

          import android.content.Intent;
          import android.net.Uri;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;

          @CapacitorPlugin(name = "NativeShare")
          public class NativeSharePlugin extends Plugin {
              @PluginMethod
              public void shareFile(PluginCall call) {
                  String data = call.getString("data", "");
                  String name = call.getString("name", "qimen_backup.json");
                  try {
                      File dir = new File(getContext().getCacheDir(), "share");
                      if (!dir.exists()) dir.mkdirs();
                      File f = new File(dir, name);
                      try (FileOutputStream fos = new FileOutputStream(f)) {
                          fos.write(data.getBytes(StandardCharsets.UTF_8));
                      }
                      Uri uri = FileProvider.getUriForFile(getContext(),
                              getContext().getPackageName() + ".fileprovider", f);
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setType("application/json");
                      i.putExtra(Intent.EXTRA_STREAM, uri);
                      i.putExtra(Intent.EXTRA_TITLE, "奇门排盘备份");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      getContext().startActivity(Intent.createChooser(i, "保存排盘数据"));
                      JSObject ret = new JSObject(); ret.put("ok", true);
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("share failed: " + e.getMessage(), e);
                  }
              }
          }
          NSPEOF

          # FileProvider(content:// URI 分享必需)
          sed -i 's|</application>|  <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/></provider>\n    </application>|' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<paths>' '    <cache-path name="share" path="share/" />' '</paths>' > android/app/src/main/res/xml/file_paths.xml
          # 开启R8混淆+资源压缩
          sed -i 's/minifyEnabled false/minifyEnabled true/' android/app/build.gradle
          sed -i '/minifyEnabled true/a\            shrinkResources true' android/app/build.gradle
          sed -i 's|proguard-android.txt|proguard-android-optimize.txt|' android/app/build.gradle
          # 添加ProGuard规则保留Capacitor
          cat >> android/app/proguard-rules.pro << 'PGEOF'
          -keep class com.getcapacitor.** { *; }
          -keep class com.qimen.yinpan.NativeSharePlugin { *; }
          -keepclassmembers class * { @android.webkit.JavascriptInterface <methods>; }
          PGEOF
          # 开启硬件加速
          sed -i 's|<application|<application android:hardwareAccelerated="true"|' android/app/src/main/AndroidManifest.xml
          # 移除所有SMS相关权限(Capacitor/WebView依赖可能注入)
          sed -i 's|<manifest |<manifest xmlns:tools="http://schemas.android.com/tools" |' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|    <uses-permission android:name="android.permission.SMS" tools:node="remove" />\n    <uses-permission android:name="android.permission.RECEIVE_SMS" tools:node="remove" />\n    <uses-permission android:name="android.permission.SEND_SMS" tools:node="remove" />\n    <uses-permission android:name="android.permission.READ_SMS" tools:node="remove" />\n    <uses-permission android:name="android.permission.BROADCAST_SMS" tools:node="remove" />\n    <application|' android/app/src/main/AndroidManifest.xml
          # 同步Android版本号
          # versionName 用完整三段(2026-09-28 起不再截断为两段)
          VERCODE=$(echo "$VER" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          sed -i "s/versionCode [0-9]*/versionCode $VERCODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle


      - name: Restore keystore
        # 从 Secrets 恢复固定签名密钥, 保证每次 Release APK 签名一致(可覆盖安装升级)
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > qimen-release.keystore

      - name: Inject signing config
        run: |
          cat >> android/app/build.gradle << 'GRADLEEOF'

          android {
            signingConfigs {
              release {
                storeFile rootProject.file('../qimen-release.keystore')
                storePassword project.findProperty('QIMEN_STORE_PASSWORD')
                keyAlias 'qimen'
                keyPassword project.findProperty('QIMEN_KEY_PASSWORD')
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLEEOF
          # 签名密码从 Secrets 运行时注入 gradle.properties(明文不入库)
          cat >> android/gradle.properties << PROPOF
          QIMEN_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          QIMEN_KEY_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          PROPOF

      - name: Inject launcher icons
        run: |
          # apt-get update 必须有: runner 的 apt 缓存是旧的, imagemagick 依赖的
          # ghostscript 包版本会 404(v1.4.3 发版实测踩过) —— linux job 两处都
          # update 了, 唯独这里漏了
          sudo apt-get update
          sudo apt-get install -y imagemagick
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.xml android/app/src/main/res/drawable*/ic_launcher*.xml
          for dir in android/app/src/main/res/mipmap-*; do
            size=$(basename "$dir" | sed 's/mipmap-//')
            case $size in
              mdpi) s=48;; hdpi) s=72;; xhdpi) s=96;; xxhdpi) s=144;; xxxhdpi) s=192;;
              *) continue;;
            esac
            convert -background '#f5f5f5' -density 300 taiji.svg -resize ${s}x${s} -gravity center -extent ${s}x${s} "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            echo "$size: ${s}x${s}"
          done

      - uses: gradle/actions/setup-gradle@v4

      - name: Sync and build
        timeout-minutes: 20
        run: |
          npx cap sync
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  release:
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build web bundle
        run: |
          npm install --legacy-peer-deps >/dev/null 2>&1
          npm run build:bundle

      - uses: actions/download-artifact@v4
        with:
          name: app-exe

      - uses: actions/download-artifact@v4
        with:
          name: macos-pkg

      - uses: actions/download-artifact@v4
        with:
          name: linux-pkg

      - uses: actions/download-artifact@v4
        with:
          name: app-apk

      - name: Flatten and rename artifacts
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # 从子目录移出所有文件到根目录
          find . -mindepth 2 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' -o -name '*.dll' -o -name '*.apk' \) -exec mv {} . \; || true
          # 重命名
          for f in *.deb;  do [ -f "$f" ] && mv "$f" "yinpan_${VER}_linux_amd64.deb"; done
          for f in *.rpm;  do [ -f "$f" ] && mv "$f" "yinpan_${VER}_linux_x86_64.rpm"; done
          for f in *.AppImage; do [ -f "$f" ] && mv "$f" "yinpan_${VER}_linux_x86_64.AppImage"; done
          for f in *.dmg;  do [ -f "$f" ] && mv "$f" "yinpan_${VER}_macos.dmg"; done
          for f in *.exe;  do [ -f "$f" ] && mv "$f" "yinpan_${VER}_windows.exe"; done
          for f in *.dll;  do [ -f "$f" ] && mv "$f" "WebView2Loader.dll" 2>/dev/null; done
          for f in *.apk;  do [ -f "$f" ] && mv "$f" "yinpan_${VER}_android.apk"; done
          ls -la yinpan_* 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            yinpan_*.deb
            yinpan_*.rpm
            yinpan_*.AppImage
            yinpan_*.dmg
            yinpan_*.exe
            yinpan_*.apk
            WebView2Loader.dll
          generate_release_notes: true

      - name: Prepare Pages
        run: |
          mkdir -p pages/v1 pages/qimen_app/css pages/qimen_app/js
          cp *.exe pages/v1/ 2>/dev/null || true
          cp *.dll pages/v1/ 2>/dev/null || true
          cp *.exe pages/ 2>/dev/null || true
          cp *.dll pages/ 2>/dev/null || true
          # 网页版排盘(零安装): 入口重定向到 standalone 页
          cat > pages/index.html << 'EOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
          <meta http-equiv="refresh" content="0;url=qimen_app/yinpan.html">
          <script>window.location.replace('qimen_app/yinpan.html');</script></head><body></body></html>
          EOF
          cp qimen_app/yinpan.html pages/qimen_app/
          cp qimen_app/css/yinpan_app.min.css pages/qimen_app/css/yinpan_app.css
          cp qimen_app/js/qimen_bundle.min.js pages/qimen_app/js/
          cp qimen_app/js/gong_detail_data.js pages/qimen_app/js/
          ls -la pages/v1/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          keep_files: true

      # 发版后自检(2026-09-28): Pages 部署有 CDN 传播延迟, 带重试拉线上 bundle,
      # 断言含本版 APP_VERSION —— 部署静默失败/缓存错乱时 CI 红灯而非无人知晓。
      - name: Verify Pages deployment
        run: |
          VER_NUM="${VER#v}"
          for i in 1 2 3 4 5 6 7 8; do
            BODY=$(curl -sfL --max-time 15 "https://wrz1911.github.io/daojiayinpan/qimen_app/js/qimen_bundle.min.js" || true)
            if [ -n "$BODY" ] && echo "$BODY" | grep -q "\"$VER_NUM\""; then
              echo "Pages 已生效: 含版本串 \"$VER_NUM\" (第 $i 次尝试)"; exit 0
            fi
            echo "第 $i 次未取到本版内容(CDN 传播中), 20s 后重试..."; sleep 20
          done
          echo "::error::Pages 部署验证失败 - 线上 bundle 未包含 v$VER_NUM"
          exit 1
        env:
          VER: ${{ github.ref_name }}
