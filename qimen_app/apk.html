<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>阴盘奇门 · 安卓版下载</title>
<style>
:root{--gold:#8a5a2b;--line:#e0ddd6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 background:#faf9f7;color:#1a1a1a;font:15px/1.8 system-ui,"Microsoft YaHei",sans-serif;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 24px;
 max-width:400px;width:100%;text-align:center;box-shadow:0 2px 16px rgba(0,0,0,.05)}
h1{margin:0 0 4px;font-size:20px;color:var(--gold)}
.sub{color:#888;font-size:13px;margin-bottom:20px}
img{width:200px;height:200px;image-rendering:pixelated;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
.btn{display:block;margin:20px 0 8px;padding:13px;background:var(--gold);color:#fff;
 text-decoration:none;border-radius:9px;font-size:16px;font-weight:600}
.btn:active{opacity:.85}
.meta{color:#999;font-size:12px;margin-top:14px;line-height:1.9}
.tip{text-align:left;background:#f7f4ef;border-radius:8px;padding:12px 14px;
 font-size:12.5px;color:#666;margin-top:16px;line-height:1.9}
code{background:#eee9e1;padding:1px 5px;border-radius:3px;font-size:12px}
</style></head><body>
<div class="card">
  <h1>阴盘奇门遁甲 · 安卓版</h1>
  <div class="sub">扫码或点按钮安装</div>
  <img src="apk-qr.png" alt="下载二维码">
  <a class="btn" href="app-release.apk" download>直接下载 APK</a>
  <div class="meta" id="meta">app-release.apk · 2.1 MB</div>
  <div class="tip">
    <b>安装说明</b><br>
    1. 手机与本机需在同一 WiFi<br>
    2. 用手机浏览器扫码或打开 <code>http://192.168.1.3/apk.html</code><br>
    3. 提示"未知来源"时，允许该浏览器安装<br>
    4. 覆盖安装不会丢数据
  </div>
</div>
<script>
fetch('app-release.apk',{method:'HEAD'}).then(r=>{
  const n=r.headers.get('Content-Length');
  if(n) document.getElementById('meta').textContent=
    'app-release.apk · '+(n/1048576).toFixed(1)+' MB · 更新于 '+new Date(r.headers.get('Last-Modified')).toLocaleDateString('zh-CN');
}).catch(()=>{});
</script></body></html>
