<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
<title>阴盘奇门 - Web版本</title>
<link rel="stylesheet" href="css/yinpan_app.css">
</head>

<body>

<!-- 顶部模式栏: 六个盘型切换常驻于此, 不再占用内容区一整行 -->
<!-- 点击由 yinpan_app.js 程序化绑定(用 onclick 确保 Tauri/Capacitor 兼容) -->
<div id="topBar">
  <label><input type="radio" name="panType" value="1" checked> 时盘</label>
  <label><input type="radio" name="panType" value="2"> 刻盘</label>
  <label><input type="radio" name="panType" value="3"> 心盘</label>
  <label><input type="radio" name="panType" value="4"> 山向</label>
  <label><input type="radio" name="panType" value="5"> 穿壬</label>
  <label><input type="radio" name="panType" value="6"> 命理</label>
</div>

<input type="checkbox" id="tianmendihu" style="display:none">
<div id="mainDIV">
  <!-- 表单 -->
  <div class="form-card">
    <div class="form-row" id="timeRow">
      <div id="selGroup" style="display:flex;align-items:center;gap:2px;font-size:15px;flex-wrap:nowrap">
        <select id="selYear" class="sel-date" onchange="doPan()"></select><span style="color:#999;font-size:12px">年</span>
        <select id="selMonth" class="sel-date" onchange="adjDays();doPan()"></select><span style="color:#999;font-size:12px">月</span>
        <select id="selDay" class="sel-date" onchange="doPan()"></select><span style="color:#999;font-size:12px">日</span>
        <select id="selHour" class="sel-date" onchange="doPan()"></select><span style="color:#999;font-size:12px">时</span>
        <select id="selMin" class="sel-date" onchange="doPan()"></select><span style="color:#999;font-size:12px">分</span>
      </div>
      <!-- 自选局并入本行: 原来它独占一行只放一个 select, 白占 33px。标签保留"自选局"
           (去掉后那个下拉框看不出是干什么的)。 -->
      <span id="zxjSpan" style="display:flex;align-items:center;gap:2px;margin-left:6px">
        <span style="font-size:12px;color:#666">自选局</span>
        <select id="selZxj" class="sel-zxj" onchange="onZxjChange()"></select>
      </span>
    </div>
    <!-- #zxjRow 已删除: 自选局搬进 timeRow 后它成了空容器, 却仍占 9px(padding 4+4 + 边框 1),
         是"时间选择器到信息表之间那段空白"的真正来源。原先写 style="display:none" **无效** ——
         setPanType 会把它重置为 ''(空串=移除行内样式), 于是回落到 CSS 的 .form-row{display:flex}。
         JS 取 zxjRow 处有 if 保护, 故直接删掉这个容器。 -->
    <div id="shanxiangInputs" class="form-row" style="padding:6px 10px;display:none;align-items:center;gap:6px">
      <span style="font-size:13px;color:#666">年</span>
      <select id="selShanXiangYear" class="sel-date" style="width:72px" onchange="doPan()"></select>
      <span style="font-size:13px;color:#666">度数</span>
      <input id="selShanXiangDeg" class="sel-date" style="width:55px" type="number" min="0" max="359" value="0" onchange="clampShanXiangDeg()" onkeydown="shanXiangDegKey(event)">
      <!-- ↑ 原为复杂内联语句(var/if/else 链), qimen_boot.js 的内联接管只解析
           fn()/fn(N)/fn('str')/fn(event) 形态, 故抽成具名函数(见 yinpan_app.js)。 -->
      <span id="shanXiangLabel" style="font-size:13px;color:#0dc2b3;font-weight:bold"></span>
    </div>
  </div>
<div id="xinpanPanel" style="display:none"></div>

  <div id="tip" style="display:none;text-align:center;color:#0dc2b3;font-size:14px;padding:4px;line-height:20px"></div>

  <div id="result"><div id="panWrap"></div></div>
</div>

	<!-- 自有 JS 与 tyme4j 历法库均由 npm run build:bundle 打包合成单一
	     qimen_bundle.min.js(见 scripts/build.sh 的 bundle 子命令, tyme4j 排在最前)。
	     ⚠️ 页面里**不能**再有内联 <script>: 内联会让 Tauri 往 CSP 注入 sha256,
	     而 CSP 一旦含 hash, 'unsafe-inline' 即被忽略 —— 所有内联 onclick 全废
	     (桌面版里表现为"宫格短按/多个按钮点击无反应")。is-mobile 标记与
	     tyme4j 别名已移入 bundle(qimen_boot.js)。 -->
	<script src="js/qimen_bundle.min.js"></script>
	<!-- gong_detail_data.js(258KB)由 yinpan_app 首次打开宫详情时懒加载 -->
</body>
</html>
