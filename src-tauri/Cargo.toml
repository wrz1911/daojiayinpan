[package]
name = "app"
version = "1.4.1"
description = "道家阴盘奇门遁甲排盘系统"
authors = ["地天泰"]
license = "MIT"
repository = "https://github.com/wrz1911/daojiayinpan"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
time = "=0.3.36"

# 桌面端专属插件:移动端没有多实例/窗口状态的概念, 不引入
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# Release 构建优化:收紧 Cargo 保守默认值以缩减二进制体积
# (排盘为 IO/计算混合负载,对峰值性能不敏感,体积与启动速度收益更大)
[profile.release]
codegen-units = 1   # 单一代码生成单元,换取更好的跨模块优化(编译略慢)
lto = true          # 链接时优化
opt-level = "s"     # 体积优先
panic = "abort"     # 去掉 unwind 表(本项目无 catch_unwind 用法)
strip = true        # 剥离调试符号
